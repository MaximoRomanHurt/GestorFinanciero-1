server.port=${PORT:8080}
spring.application.name=gestorFinanciero

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}}
spring.datasource.username=${DB_USER:financista}
spring.datasource.password=${DB_PASSWORD:financista}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.org.springframework.web=DEBUG
server.error.include-message=always
server.error.include-binding-errors=always